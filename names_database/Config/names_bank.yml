apiVersion: apps/v1
kind: Deployment
metadata:
  name: banks-names-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank_names
  template:
    metadata:
      labels:
        app: bank_names
    spec:
      containers:
        - name: microsservice-bank-names
          image: namesbank:0.0.1
          ports:
            - containerPort: 8080
          resources:
              requests:
                  memory: "80Mi"
                  cpu: "100m"
              limits:
                  memory: "128Mi"
                  cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: bank-names-service
spec:
  selector:
    app: bank_names
  ports:
    - protocol: TCP
      port: 8080       # porta do service no cluster
      targetPort: 8080 # porta do container
      nodePort: 30007  # porta exposta no host
  type: NodePort
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: bank-names-hpa
spec:
  minReplicas: 1
  maxReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: banks-names-deployment
  targetCPUUtilizationPercentage: 80