receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  jaeger:
    endpoint: jaeger-all-in-one:14250
    tls:
      insecure: true

  zipkin:
    endpoint: http://zipkin-all-in-one:9411/api/v2/spans

service:
  pipelines:
    traces:
      receivers:
        - otlp
      exporters:
        - jaeger
        - zipkin